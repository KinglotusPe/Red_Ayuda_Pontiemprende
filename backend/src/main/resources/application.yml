server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: red-ayuda-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/red_ayuda_db}
    username: ${SPRING_DATASOURCE_USERNAME:redayuda_user}
    password: ${SPRING_DATASOURCE_PASSWORD:redayuda_secret_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

app:
  jwt:
    secret: ${JWT_SECRET:super_secret_jwt_key_red_ayuda_minimum_32_characters_for_hmac_sha256}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 min
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  security:
    share-token-expiration-hours: ${SHARE_TOKEN_EXPIRATION_HOURS:24}
  storage:
    type: ${STORAGE_TYPE:local} # local o s3
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      access-key: ${S3_ACCESS_KEY:minio_access_key}
      secret-key: ${S3_SECRET_KEY:minio_secret_password}
      bucket-name: ${S3_BUCKET_NAME:red-ayuda-audios}
      region: ${S3_REGION:us-east-1}
    local:
      upload-dir: ${LOCAL_UPLOAD_DIR:./storage/audios}
  notification:
    provider: ${NOTIFICATION_PROVIDER:dev_mock} # dev_mock, twilio, meta
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
