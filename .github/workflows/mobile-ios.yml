name: Mobile iOS - Build & Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ios.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build and Validate iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Official Platform Native Directories
        working-directory: ./mobile
        run: |
          mkdir -p /tmp/mobile_backup
          cp -f ios/Runner/Info.plist /tmp/mobile_backup/Info.plist 2>/dev/null || true
          rm -rf android ios
          flutter create --org pe.redayuda --project-name red_ayuda --platforms=android,ios .
          if [ -f /tmp/mobile_backup/Info.plist ]; then
            cp -f /tmp/mobile_backup/Info.plist ios/Runner/Info.plist
          fi
          if [ -d ios/Runner/Assets.xcassets/AppIcon.appiconset ]; then
            for f in ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png; do
              [ -f "$f" ] && cp -f assets/images/logo.png "$f" 2>/dev/null || true
            done
          fi

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: ./mobile
        run: flutter test

      - name: Build iOS (No Codesign)
        working-directory: ./mobile
        run: flutter build ios --no-codesign --release

      - name: Package iOS App Bundle & IPA
        working-directory: ./mobile
        run: |
          mkdir -p build_outputs
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../build_outputs/RED-Ayuda-iOS.ipa Payload
          zip -r ../../../build_outputs/RED-Ayuda-iOS-Runner-unsigned.zip Runner.app
          cd ../../..

      - name: Upload iOS App Bundle & IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RED-Ayuda-iOS-Package
          path: |
            mobile/build_outputs/RED-Ayuda-iOS.ipa
            mobile/build_outputs/RED-Ayuda-iOS-Runner-unsigned.zip
          retention-days: 30
