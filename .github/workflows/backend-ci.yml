name: Backend CI - Spring Boot

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and Test Backend (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Build with Maven
        working-directory: ./backend
        run: ./mvnw clean package -B

      - name: Rename JAR for Distribution
        working-directory: ./backend
        run: |
          mkdir -p target/dist
          cp target/*.jar target/dist/red-ayuda-backend.jar

      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: red-ayuda-backend-jar
          path: backend/target/dist/red-ayuda-backend.jar
          retention-days: 30
