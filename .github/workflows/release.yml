name: Release - Publish Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build All Artifacts and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Build Android AAB
        working-directory: ./mobile
        run: flutter build appbundle --release

      - name: Set up JDK 21 for Backend
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Backend JAR
        working-directory: ./backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -B -DskipTests

      - name: Prepare Release Files
        run: |
          mkdir -p release_assets
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release_assets/RED-Ayuda-${{ github.ref_name }}.apk
          cp mobile/build/app/outputs/bundle/release/app-release.aab release_assets/RED-Ayuda-${{ github.ref_name }}.aab
          cp backend/target/*.jar release_assets/red-ayuda-backend-${{ github.ref_name }}.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/RED-Ayuda-${{ github.ref_name }}.apk
            release_assets/RED-Ayuda-${{ github.ref_name }}.aab
            release_assets/red-ayuda-backend-${{ github.ref_name }}.jar
          name: RED AYUDA ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## RED AYUDA — Release Oficial ${{ github.ref_name }}
            *Lema: “Una población organizada, una ciudad más segura”*

            ### 📱 Descargas Disponibles:
            - **Android APK (Instalación directa):** `RED-Ayuda-${{ github.ref_name }}.apk`
            - **Android App Bundle (Google Play Store):** `RED-Ayuda-${{ github.ref_name }}.aab`
            - **Backend JAR Ejecutable (Java 21):** `red-ayuda-backend-${{ github.ref_name }}.jar`

            ### 🛠️ Novedades de la versión:
            - Sistema de alerta SOS instantáneo con cuenta regresiva de 10s y cancelación por PIN normal.
            - Mecanismo de seguridad silencioso ante agresiones mediante PIN de coacción.
            - Ubicación redundante: GPS satelital, aproximación de red y última conocida.
            - Almacenamiento privado de audios de emergencia de 5 segundos.
            - Seguimiento web en tiempo real para contactos de confianza sin necesidad de aplicación.
            - Directorio oficial de emergencias (PNP 105, SAMU 106, Bomberos 116, Serenazgo Ayacucho).
