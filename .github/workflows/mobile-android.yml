name: Mobile Android - Build APK & AAB

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Official Platform Native Directories
        working-directory: ./mobile
        run: |
          mkdir -p /tmp/mobile_backup
          cp -f android/app/src/main/AndroidManifest.xml /tmp/mobile_backup/AndroidManifest.xml 2>/dev/null || true
          rm -rf android ios
          flutter create --org pe.redayuda --project-name red_ayuda --platforms=android,ios .
          chmod +x android/gradlew 2>/dev/null || true
          if [ -f /tmp/mobile_backup/AndroidManifest.xml ]; then
            cp -f /tmp/mobile_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Verify Flutter & Environment
        working-directory: ./mobile
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze Dart Code
        working-directory: ./mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        working-directory: ./mobile
        run: flutter test

      - name: Build Android Debug APK
        working-directory: ./mobile
        run: flutter build apk --debug -v

      - name: Build Android Release APK (Default Signed)
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        working-directory: ./mobile
        run: flutter build appbundle --release

      - name: Prepare Artifacts Directory
        working-directory: ./mobile
        run: |
          mkdir -p build_outputs
          cp build/app/outputs/flutter-apk/app-debug.apk build_outputs/RED-Ayuda-Debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk build_outputs/RED-Ayuda.apk
          cp build/app/outputs/bundle/release/app-release.aab build_outputs/RED-Ayuda.aab

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: RED-Ayuda-Android-APK
          path: |
            mobile/build_outputs/RED-Ayuda.apk
            mobile/build_outputs/RED-Ayuda-Debug.apk
          retention-days: 30

      - name: Upload Android AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: RED-Ayuda-Android-AAB
          path: mobile/build_outputs/RED-Ayuda.aab
          retention-days: 30
